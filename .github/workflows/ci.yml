name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があれば古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager を使う

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check & build
        run: pnpm build

      - name: Test with coverage (90% 未満で失敗)
        run: pnpm coverage

  rust:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # tauri::generate_context! はコンパイル時に frontendDist (../dist) を参照する
      - name: Create placeholder frontend dist
        run: mkdir -p ../dist

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test with coverage (行カバレッジ 90% 未満で失敗)
        run: cargo llvm-cov --lib --summary-only --fail-under-lines 90
